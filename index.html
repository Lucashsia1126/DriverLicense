<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lalamove 證件拍攝 (V12)</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        /* --- V11/V12 CSS 變數定義 (Lalamove 橘色系) --- */
        :root {
            --primary-orange: #ff6600;       
            --primary-orange-hover: #e55c00; 
            --light-orange-bg: #fff5f0;      
            --orange-border: #ffcc99;        
            --text-dark: #333;
            --grey-btn: #6c757d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 15px;
            padding-bottom: 100px;
            color: var(--text-dark);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-top: 4px solid var(--primary-orange);
        }

        h1 { text-align: center; color: #444; font-size: 20px; margin-bottom: 20px; }

        .input-group {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 10px;
            background-color: #fcfcfc;
            transition: all 0.3s;
        }
        .input-group.highlight {
            background-color: var(--light-orange-bg);
            border-color: var(--orange-border);
        }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #444; font-size: 15px; }

        input[type="text"] {
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: var(--primary-orange);
            outline: none;
        }
        input[type="file"] { display: none; }

        .upload-btn {
            display: block; width: 100%; padding: 12px; background-color: var(--primary-orange); color: white;
            text-align: center; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer;
            transition: background 0.2s;
        }
        .upload-btn:hover { background-color: var(--primary-orange-hover); }
        
        .preview-box { margin-top: 15px; text-align: center; display: none; }
        .preview-box img { 
            max-width: 100%; 
            border-radius: 4px; 
            border: 1px solid #ddd; 
            display: block;
            margin: 0 auto 10px auto;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 8px;
        }
        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: background 0.2s;
        }
        .btn-dl { background-color: var(--grey-btn); } 
        .btn-share { background-color: var(--primary-orange); } 
        .btn-share:hover { background-color: var(--primary-orange-hover); }

        /* --- 雲端上傳狀態提示樣式 --- */
        .upload-status-text {
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
        }

        /* --- 底部批次操作區樣式 --- */
        .batch-actions-area {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px dashed #eee;
            text-align: center;
        }
        .batch-btn-main {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-orange);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(255, 102, 0, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .batch-btn-main:hover:not(:disabled) {
            background-color: var(--primary-orange-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(255, 102, 0, 0.3);
        }
        .batch-btn-main:disabled {
            background-color: #ccc;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.8;
        }
        .batch-note {
            margin-top: 10px;
            font-size: 13px;
            color: #888;
        }

        /* --- 裁切視窗 --- */
        #cropperModal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000; z-index: 9999;
            display: none; flex-direction: column;
        }
        .cropper-wrapper {
            flex: 1; min-height: 0; overflow: hidden; position: relative; background-color: #000;
        }
        #imageToCrop { display: block; max-width: 100%; max-height: 100%; }
        
        .cropper-controls {
            height: 80px; background: #111; display: flex;
            justify-content: space-between; align-items: center; padding: 0 15px;
            flex-shrink: 0; z-index: 10000;
        }
        .cropper-btn {
            padding: 10px 16px; border-radius: 8px; border: none; font-size: 14px; font-weight: bold; color: #fff; cursor: pointer;
        }
        .btn-cancel { background: #555; }
        .btn-rotate { background: #17a2b8; } 
        .btn-confirm { background: var(--primary-orange); padding: 10px 24px; font-size: 16px; }

        /* --- Loading --- */
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20000; display: none;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3; 
            border-top: 4px solid var(--primary-orange);
            border-radius: 50%; animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        .loading-text { color: #fff; font-weight: bold; font-size: 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">處理中...</div>
</div>

<div class="container">
    <h1>🚚 Lalamove 證件拍攝助手 (V12)</h1>

    <div class="input-group highlight">
        <label>步驟 1：輸入姓名 (必填)</label>
        <input type="text" id="userName" placeholder="請輸入司機姓名">
    </div>

    <div class="input-group">
        <label>1. 身份證 (正面)</label>
        <label for="input_id_front" class="upload-btn">📸 拍攝並裁切</label>
        <input type="file" id="input_id_front" accept="image/*" onchange="handleFileSelect(this, '身份證', '正面')">
        <div class="preview-box" id="preview_id_front">
            <img id="img_id_front">
            <div class="action-buttons" id="actions_id_front" style="display:none;">
                <button class="action-btn btn-dl" onclick="triggerDownload('id_front')">⬇️ 下載</button>
                <button class="action-btn btn-share" onclick="triggerShare('id_front')">📤 分享</button>
            </div>
            <div class="upload-status-text" id="status_id_front"></div>
        </div>
    </div>
    
    <div class="input-group">
        <label>2. 身份證 (反面)</label>
        <label for="input_id_back" class="upload-btn">📸 拍攝並裁切</label>
        <input type="file" id="input_id_back" accept="image/*" onchange="handleFileSelect(this, '身份證', '反面')">
        <div class="preview-box" id="preview_id_back">
            <img id="img_id_back">
            <div class="action-buttons" id="actions_id_back" style="display:none;">
                <button class="action-btn btn-dl" onclick="triggerDownload('id_back')">⬇️ 下載</button>
                <button class="action-btn btn-share" onclick="triggerShare('id_back')">📤 分享</button>
            </div>
            <div class="upload-status-text" id="status_id_back"></div>
        </div>
    </div>
    
    <div class="input-group">
        <label>3. 職業駕照 (正面)</label>
        <label for="input_pro_front" class="upload-btn">📸 拍攝並裁切</label>
        <input type="file" id="input_pro_front" accept="image/*" onchange="handleFileSelect(this, '職業駕照', '正面')">
        <div class="preview-box" id="preview_pro_front">
            <img id="img_pro_front">
            <div class="action-buttons" id="actions_pro_front" style="display:none;">
                <button class="action-btn btn-dl" onclick="triggerDownload('pro_front')">⬇️ 下載</button>
                <button class="action-btn btn-share" onclick="triggerShare('pro_front')">📤 分享</button>
            </div>
            <div class="upload-status-text" id="status_pro_front"></div>
        </div>
    </div>

    <div class="input-group">
        <label>4. 職業駕照 (反面)</label>
        <label for="input_pro_back" class="upload-btn">📸 拍攝並裁切</label>
        <input type="file" id="input_pro_back" accept="image/*" onchange="handleFileSelect(this, '職業駕照', '反面')">
        <div class="preview-box" id="preview_pro_back">
            <img id="img_pro_back">
            <div class="action-buttons" id="actions_pro_back" style="display:none;">
                <button class="action-btn btn-dl" onclick="triggerDownload('pro_back')">⬇️ 下載</button>
                <button class="action-btn btn-share" onclick="triggerShare('pro_back')">📤 分享</button>
            </div>
            <div class="upload-status-text" id="status_pro_back"></div>
        </div>
    </div>

    <div class="input-group">
        <label>5. 駕照正面 (無職業駕照者)</label>
        <label for="input_std_front" class="upload-btn">📸 拍攝並裁切</label>
        <input type="file" id="input_std_front" accept="image/*" onchange="handleFileSelect(this, '駕照', '正面')">
        <div class="preview-box" id="preview_std_front">
            <img id="img_std_front">
            <div class="action-buttons" id="actions_std_front" style="display:none;">
                <button class="action-btn btn-dl" onclick="triggerDownload('std_front')">⬇️ 下載</button>
                <button class="action-btn btn-share" onclick="triggerShare('std_front')">📤 分享</button>
            </div>
            <div class="upload-status-text" id="status_std_front"></div>
        </div>
    </div>

    <div class="batch-actions-area">
        <button id="batchShareBtn" class="batch-btn-main" onclick="triggerBatchShare()" disabled>
            <span style="font-size: 24px;">📤</span> 批次分享全部 (0)
        </button>
        <div class="batch-note">(需完成至少一張照片的裁切才能使用此功能)</div>
    </div>

</div>

<div id="cropperModal">
    <div class="cropper-wrapper">
        <img id="imageToCrop" src="">
    </div>
    <div class="cropper-controls">
        <button class="cropper-btn btn-cancel" onclick="cancelCropping()">取消</button>
        <button class="cropper-btn btn-rotate" onclick="rotateImage()">↻ 旋轉</button>
        <button class="cropper-btn btn-confirm" onclick="confirmCropping()">完成</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
    // ⚠️ 請將下方網址修改為你的 Google Apps Script (GAS) 部署後的 Web App 網址
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyfehKnaL-DcH6lp448A0nCSYRd3gJGdMgs5aUYUfGh67BdgCF2jI0ozX8rYkKzD26a/exec';

    let cropper = null;
    let currentInputId = ''; 
    let currentDocType = '';
    let currentSide = '';
    
    // 儲存處理完成的 Blob 資料
    const processedFiles = {}; 

    const modal = document.getElementById('cropperModal');
    const imageElement = document.getElementById('imageToCrop');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const WATERMARK_TEXT = "僅供Lalamove 租車專案使用";
    let activeObjectUrl = null;

    function updateBatchButtonState() {
        const count = Object.keys(processedFiles).length;
        const btn = document.getElementById('batchShareBtn');
        btn.innerHTML = `<span style="font-size: 24px;">📤</span> 批次分享全部 (${count})`;
        btn.disabled = count === 0;
    }

    function showLoading(text) { 
        if(text) document.querySelector('.loading-text').textContent = text;
        loadingOverlay.style.display = 'flex'; 
    }
    function hideLoading() { loadingOverlay.style.display = 'none'; }

    function handleFileSelect(input, docType, side) {
        const userName = document.getElementById('userName').value.trim();
        if (!userName) {
            alert("⚠️ 請先在最上方輸入姓名！");
            input.value = '';
            document.getElementById('userName').focus();
            return;
        }

        if (input.files && input.files[0]) {
            showLoading("載入中..."); 
            const file = input.files[0];
            currentInputId = input.id;
            currentDocType = docType;
            currentSide = side;
            setTimeout(() => { compressAndInit(file); }, 10);
        }
        input.value = '';
    }

    function compressAndInit(file) {
        if (activeObjectUrl) URL.revokeObjectURL(activeObjectUrl);
        const img = new Image();
        activeObjectUrl = URL.createObjectURL(file);
        
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const MAX_WIDTH = 1280; 
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
            URL.revokeObjectURL(activeObjectUrl);

            canvas.toBlob((blob) => {
                if(blob) {
                    activeObjectUrl = URL.createObjectURL(blob);
                    startCropping(activeObjectUrl);
                } else {
                    alert("圖片載入錯誤"); hideLoading();
                }
            }, 'image/jpeg', 0.85);
        };
        img.onerror = function() { alert("讀取失敗，請確認檔案格式"); hideLoading(); };
        img.src = activeObjectUrl;
    }

    function startCropping(imageSrc) {
        imageElement.src = imageSrc;
        modal.style.display = 'flex';
        if (cropper) cropper.destroy();
        cropper = new Cropper(imageElement, {
            aspectRatio: 85.6 / 54, 
            viewMode: 1,
            dragMode: 'move',
            autoCropArea: 0.9,
            background: false,
            responsive: true,
            ready: function() { hideLoading(); }
        });
    }

    function rotateImage() { if (cropper) cropper.rotate(90); }
    function cancelCropping() {
        modal.style.display = 'none';
        if (cropper) cropper.destroy();
        cropper = null;
        if (activeObjectUrl) URL.revokeObjectURL(activeObjectUrl);
        hideLoading();
    }

    function confirmCropping() {
        if (!cropper) return;
        showLoading("處理浮水印中...");

        setTimeout(() => {
            const croppedCanvas = cropper.getCroppedCanvas({
                width: 1200, 
                imageSmoothingQuality: 'high',
            });

            const finalCanvas = document.createElement('canvas');
            const ctx = finalCanvas.getContext('2d');
            finalCanvas.width = croppedCanvas.width;
            finalCanvas.height = croppedCanvas.height;
            ctx.drawImage(croppedCanvas, 0, 0);

            // --- 浮水印 ---
            ctx.save();
            ctx.translate(finalCanvas.width / 2, finalCanvas.height / 2);
            ctx.rotate(-25 * Math.PI / 180);
            
            const fontSize = Math.floor(finalCanvas.height / 12);
            ctx.font = `bold ${fontSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            ctx.lineWidth = fontSize / 12;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.strokeText(WATERMARK_TEXT, 0, 0);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; 
            ctx.fillText(WATERMARK_TEXT, 0, 0);
            ctx.restore();
            // -------------

            finalCanvas.toBlob(function(blob) {
                const key = currentInputId.replace('input_', '');
                const userName = document.getElementById('userName').value.trim();
                const fileName = `Lalamove_${userName}_${currentDocType}_${currentSide}.jpg`;

                processedFiles[key] = {
                    blob: blob,
                    fileName: fileName
                };

                const url = URL.createObjectURL(blob);
                document.getElementById('img_' + key).src = url;
                document.getElementById('preview_' + key).style.display = 'block';
                document.getElementById('actions_' + key).style.display = 'flex';

                updateBatchButtonState();
                cancelCropping();
                hideLoading();

                // ☁️ 照片裁切完成後，自動發送上傳至 Google 雲端硬碟
                autoUploadToDrive(key, blob, fileName);

            }, 'image/jpeg', 0.92);

        }, 50);
    }

    // --- 自動上傳至 Google Drive 函式 ---
    function autoUploadToDrive(key, blob, fileName) {
        const statusEl = document.getElementById('status_' + key);
        if (statusEl) {
            statusEl.style.color = '#ff6600';
            statusEl.innerText = '☁️ 正在自動上傳至 Google 雲端...';
        }

        const reader = new FileReader();
        reader.onloadend = function() {
            const base64Image = reader.result;

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    base64: base64Image,
                    mimeType: 'image/jpeg',
                    fileName: fileName
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.result === 'success') {
                    if (statusEl) {
                        statusEl.style.color = 'green';
                        statusEl.innerText = '✅ 已成功自動備份至 Google 雲端！';
                    }
                    console.log('雲端檔案連結:', data.fileUrl);
                } else {
                    throw new Error(data.message || '上傳失敗');
                }
            })
            .catch(err => {
                console.error('上傳至雲端失敗:', err);
                if (statusEl) {
                    statusEl.style.color = 'red';
                    statusEl.innerText = '❌ 自動備份失敗，請檢查網路或 GAS 設定。';
                }
            });
        };
        reader.readAsDataURL(blob);
    }

    function triggerDownload(key) {
        const fileData = processedFiles[key];
        if (!fileData) return;
        const url = URL.createObjectURL(fileData.blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileData.fileName;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function triggerShare(key) {
        const fileData = processedFiles[key];
        if (!fileData) return;
        if (navigator.share) {
            try {
                const file = new File([fileData.blob], fileData.fileName, { type: 'image/jpeg' });
                await navigator.share({
                    files: [file]
                });
            } catch (error) {
                if (error.name !== 'AbortError') console.error('分享失敗', error);
            }
        } else {
            alert("您的瀏覽器不支援原生分享，請使用下載功能。");
        }
    }

    async function triggerBatchShare() {
        const filesArray = [];
        for (const key in processedFiles) {
            if (processedFiles.hasOwnProperty(key)) {
                const fileData = processedFiles[key];
                const file = new File([fileData.blob], fileData.fileName, { type: 'image/jpeg' });
                filesArray.push(file);
            }
        }

        if (filesArray.length === 0) {
            alert("尚未處理任何照片！");
            return;
        }

        if (navigator.share && navigator.canShare && navigator.canShare({ files: filesArray })) {
            try {
                showLoading("準備批次分享...");
                await navigator.share({
                    files: filesArray,
                    title: 'Lalamove 證件批次上傳'
                });
                console.log('批次分享成功');
            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error('批次分享失敗', error);
                    alert("分享過程中發生錯誤，請稍後再試。");
                }
            } finally {
                hideLoading();
            }
        } else {
            alert("您的手機或瀏覽器不支援一次分享多個檔案，請改用個別下載。");
        }
    }
</script>

</body>
</html>
